# Packaging for a downloadable build. `npm run dist`.
#
# Two Windows targets, because they answer different questions:
#   nsis     — a normal installer: Start Menu entry, desktop shortcut,
#              uninstaller, and per-user install so it needs no admin rights.
#   portable — one .exe that runs from anywhere (a USB stick, a Downloads
#              folder) and installs nothing. Settings and the Spotify session
#              still live in userData, so it is not a sandboxed copy.
appId: com.syncity.app
productName: Syncity
copyright: Copyright © 2026 Syncity

directories:
  buildResources: resources
  output: dist

# Development dependencies are excluded automatically, and production ones are
# added automatically — this only has to name the app's own build output.
files:
  - out/**
  - package.json

# Images the MAIN process loads by path at runtime. They must sit outside
# app.asar: main/assets.ts resolves them from process.resourcesPath in a
# packaged build precisely because reading them back out of the archive is the
# thing that silently fails.
extraResources:
  - from: resources/app-icon.png
    to: app-icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png

# Where the app looks for updates, and where `npm run dist -- --publish always`
# would upload them. The releases are public, so a running app reads this feed
# without a token; publishing needs GH_TOKEN in the environment.
publish:
  provider: github
  owner: jacksontran2806-png
  repo: syncity

win:
  # electron-builder derives the multi-resolution .ico from this PNG, so there
  # is one icon to keep up to date rather than a generated binary in the repo.
  icon: resources/app-icon.png
  # These builds are unsigned, and electron-updater refuses an update whose
  # signature it cannot match against the installed app's. With nothing to
  # match, that check can only fail — it is turned off here rather than left to
  # break every update with an error about a publisher name. Turn it back on
  # the day these builds get a certificate.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Not a one-click installer: the user gets to see where it is going and pick
  # somewhere else, which for an app that sits in the tray all day is worth the
  # extra click.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user, so installing never needs an administrator.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Syncity
  # No version in the filename, deliberately: it makes
  # github.com/.../releases/latest/download/Syncity-Setup.exe a permanent
  # link, so the website's download button never has to be edited when a new
  # version ships. The version lives in the release title and in the app.
  artifactName: Syncity-Setup.${ext}

portable:
  artifactName: Syncity-Portable.${ext}

mac:
  icon: resources/app-icon.png
  category: public.app-category.music
  target:
    - dmg

linux:
  icon: resources/app-icon.png
  category: Audio
  target:
    - AppImage
